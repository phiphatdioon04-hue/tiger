<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบจองบริการแอร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { canvas: 'rgb(249,249,247)', ink: '#1A1A1A', muted: '#888780', hover: '#F1EFE8' },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
        },
      },
    }
  </script>
  <style>
    body { background-color: rgb(249,249,247); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .border-subtle { border-color: rgba(0,0,0,0.12); }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px #1A1A1A; }
    .btn-primary:focus { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1A1A1A; }
    .service-row { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<!-- ── Loading Overlay ─────────────────────────────────────────────────────── -->
<div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-canvas">
  <svg class="animate-spin mb-4" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <p class="text-[14px] font-medium text-ink" id="loadingText">กำลังโหลดราคาล่าสุดจากชีต…</p>
  <p class="text-[12px] text-muted mt-1" id="loadingDate"></p>
</div>

<!-- ── Price Warning Banner ───────────────────────────────────────────────── -->
<div id="priceWarning" class="hidden no-print bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-[13px] text-amber-800 flex items-center gap-2">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span id="priceWarningText"></span>
</div>

<!-- ── Main App ────────────────────────────────────────────────────────────── -->
<div class="flex-1 py-10 px-4">
  <div class="max-w-5xl mx-auto">

    <!-- Header -->
    <div class="mb-8 flex items-start justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-[23px] font-semibold text-ink">ระบบจองและคำนวณค่าบริการแอร์</h1>
        <p class="text-[14px] text-muted mt-1">กรอกข้อมูลเพื่อคำนวณค่าบริการและสร้างใบจอง</p>
      </div>
      <!-- Price source status badge -->
      <div id="priceSourceBadge" class="hidden text-[12px] text-muted flex items-center gap-1.5 mt-1">
        <span id="priceSourceDot" class="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
        <span id="priceSourceText"></span>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-6">

      <!-- FORM COLUMN -->
      <div class="flex-1 flex flex-col gap-6 no-print" id="formSection">

        <!-- Customer Info -->
        <div class="bg-white rounded-xl border border-subtle shadow-sm p-6">
          <h2 class="text-[18px] font-semibold text-ink flex items-center gap-2 mb-5">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ข้อมูลลูกค้า
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-[14px] font-medium text-ink mb-1.5">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
              <input id="customerName" type="text" placeholder="ชื่อลูกค้า" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink placeholder-muted bg-white" />
            </div>
            <div>
              <label class="block text-[14px] font-medium text-ink mb-1.5">เบอร์โทรศัพท์ <span class="text-red-500">*</span></label>
              <input id="customerPhone" type="tel" placeholder="0XX-XXX-XXXX" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink placeholder-muted bg-white" />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[14px] font-medium text-ink mb-1.5">ที่อยู่ / สถานที่บริการ</label>
              <textarea id="customerAddress" rows="2" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink placeholder-muted bg-white resize-none"></textarea>
            </div>
          </div>
        </div>

        <!-- Date / Time / Distance -->
        <div class="bg-white rounded-xl border border-subtle shadow-sm p-6">
          <h2 class="text-[18px] font-semibold text-ink flex items-center gap-2 mb-5">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            วันเวลาและระยะทาง
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-[14px] font-medium text-ink mb-1.5">วันที่บริการ <span class="text-red-500">*</span></label>
              <input id="serviceDate" type="date" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white" />
            </div>
            <div>
              <label class="block text-[14px] font-medium text-ink mb-1.5">เวลา <span class="text-red-500">*</span></label>
              <input id="serviceTime" type="time" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white" />
            </div>
            <div>
              <label class="block text-[14px] font-medium text-ink mb-1.5">ระยะทาง</label>
              <select id="distance" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white">
                <option value="0">ในเขต (ฟรี)</option>
                <option value="100">1–10 กม. (+100 บาท)</option>
                <option value="200">11–20 กม. (+200 บาท)</option>
                <option value="350">21–35 กม. (+350 บาท)</option>
                <option value="500">36–50 กม. (+500 บาท)</option>
                <option value="800">51 กม. ขึ้นไป (+800 บาท)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Services -->
        <div class="bg-white rounded-xl border border-subtle shadow-sm p-6">
          <h2 class="text-[18px] font-semibold text-ink flex items-center gap-2 mb-5">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            รายการบริการ
          </h2>
          <div id="serviceList" class="flex flex-col gap-3 mb-4"></div>
          <button onclick="addServiceRow()" class="flex items-center gap-2 text-[14px] font-medium text-ink border border-subtle rounded-lg px-4 py-2 bg-white hover:bg-hover transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            เพิ่มรายการบริการ
          </button>
        </div>

        <!-- Note -->
        <div class="bg-white rounded-xl border border-subtle shadow-sm p-6">
          <h2 class="text-[18px] font-semibold text-ink flex items-center gap-2 mb-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            หมายเหตุ
          </h2>
          <textarea id="note" rows="2" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink placeholder-muted bg-white resize-none"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <button onclick="calculate()" class="btn-primary flex-1 bg-ink text-white text-[14px] font-medium rounded-lg px-8 py-2.5 hover:bg-zinc-800 transition-colors">
            คำนวณและสร้างใบจอง
          </button>
          <button onclick="resetForm()" class="border border-subtle text-ink text-[14px] font-medium rounded-lg px-6 py-2.5 bg-white hover:bg-hover transition-colors">
            ล้างข้อมูล
          </button>
        </div>

        <div id="errorMsg" class="hidden text-[13px] text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-3"></div>
      </div>

      <!-- SUMMARY COLUMN -->
      <div class="lg:w-80 flex flex-col gap-4">
        <div id="summaryCard" class="rounded-xl border border-dashed p-6" style="border-color:rgba(0,0,0,0.15)">
          <div id="emptyState" class="flex flex-col items-center justify-center py-10 text-center">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="1.2" class="mb-3"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
            <p class="text-[14px] text-muted">กรอกข้อมูลและกด<br/>«คำนวณและสร้างใบจอง»<br/>เพื่อดูสรุปที่นี่</p>
          </div>
          <div id="summaryContent" class="hidden"></div>
        </div>
        <button id="printBtn" onclick="window.print()" class="hidden no-print border border-subtle text-ink text-[14px] font-medium rounded-lg px-6 py-2.5 bg-white hover:bg-hover transition-colors w-full flex items-center justify-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          พิมพ์ใบจอง
        </button>
      </div>

    </div>
  </div>
</div>

<div id="printArea" class="hidden"></div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
// วาง Web App URL จาก Google Apps Script ตรงนี้หลัง deploy
const APPS_SCRIPT_URL = '';

// ── Fallback prices (used when sheet is unreachable) ──────────────────────
const FALLBACK = {
  sizes: ['9,000 BTU','12,000 BTU','18,000 BTU','24,000 BTU','36,000 BTU','แอร์แคสเซท','แอร์ตั้งพื้น/ฝังฝ้า'],
  services: {
    'ล้างแอร์':    { '9,000 BTU':600,  '12,000 BTU':700,  '18,000 BTU':900,  '24,000 BTU':1100, '36,000 BTU':1400, 'แอร์แคสเซท':1800, 'แอร์ตั้งพื้น/ฝังฝ้า':1600 },
    'ซ่อมแอร์':   { '9,000 BTU':800,  '12,000 BTU':900,  '18,000 BTU':1100, '24,000 BTU':1300, '36,000 BTU':1600, 'แอร์แคสเซท':2000, 'แอร์ตั้งพื้น/ฝังฝ้า':1800 },
    'ติดตั้งแอร์': { '9,000 BTU':2500, '12,000 BTU':2800, '18,000 BTU':3500, '24,000 BTU':4200, '36,000 BTU':5500, 'แอร์แคสเซท':7000, 'แอร์ตั้งพื้น/ฝังฝ้า':6500 },
  },
};

// ── State ──────────────────────────────────────────────────────────────────
let PRICES = {};
let SERVICE_TYPES = [];
let AC_SIZES = [];
let rowCount = 0;

// ── Price Loading ──────────────────────────────────────────────────────────

function buildFromData(data) {
  SERVICE_TYPES = Object.keys(data.services).map(k => ({ value: k, label: k }));
  AC_SIZES      = data.sizes.map(s => ({ value: s, label: s }));
  PRICES        = data.services;
}

function showWarning(msg) {
  const el = document.getElementById('priceWarning');
  document.getElementById('priceWarningText').textContent = msg;
  el.classList.remove('hidden');
}

function hideWarning() {
  document.getElementById('priceWarning').classList.add('hidden');
}

function setPriceSourceBadge(text, ok) {
  const badge = document.getElementById('priceSourceBadge');
  const dot   = document.getElementById('priceSourceDot');
  document.getElementById('priceSourceText').textContent = text;
  dot.className = `w-2 h-2 rounded-full inline-block ${ok ? 'bg-green-400' : 'bg-amber-400'}`;
  badge.classList.remove('hidden');
}

async function loadPrices() {
  document.getElementById('loadingDate').textContent =
    `วันที่ ${new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' })}`;

  if (APPS_SCRIPT_URL) {
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.sizes || !data.services) throw new Error('invalid format');
      buildFromData(data);
      hideWarning();
      finishInit('live');
      return;
    } catch (err) {
      console.warn('Price fetch failed:', err);
    }
  }

  // Fallback
  buildFromData(FALLBACK);
  finishInit('fallback');
}

function finishInit(source) {
  document.getElementById('loadingOverlay').style.display = 'none';

  if (source === 'live') {
    const now = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    setPriceSourceBadge(`ราคาล่าสุดจาก Google Sheet (${now})`, true);
  } else {
    setPriceSourceBadge('ใช้ราคาเริ่มต้น (ไม่ได้ตั้งค่า Script URL)', false);
    showWarning(APPS_SCRIPT_URL
      ? 'โหลดราคาจากชีตไม่สำเร็จ — ใช้ราคาเริ่มต้นแทน'
      : 'ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL — ระบบใช้ราคาเริ่มต้นแทน กรุณาดู apps-script.gs เพื่อตั้งค่า');
  }

  const today = new Date();
  document.getElementById('serviceDate').value = today.toISOString().split('T')[0];
  document.getElementById('serviceTime').value = '09:00';
  addServiceRow();
}

// ── Row Management ─────────────────────────────────────────────────────────

function addServiceRow() {
  rowCount++;
  const id = rowCount;
  const container = document.getElementById('serviceList');
  const row = document.createElement('div');
  row.id = `row-${id}`;
  row.className = 'service-row flex flex-col sm:flex-row gap-2 items-start sm:items-center rounded-lg p-3 border border-subtle';
  row.style.background = 'rgb(249,249,247)';
  row.innerHTML = `
    <div class="flex-1 min-w-0">
      <label class="block text-[13px] font-medium text-muted mb-1">ประเภทบริการ</label>
      <select onchange="updateRowPrice(${id})" id="svcType-${id}" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white">
        ${SERVICE_TYPES.map(s => `<option value="${s.value}">${s.label}</option>`).join('')}
      </select>
    </div>
    <div class="flex-1 min-w-0">
      <label class="block text-[13px] font-medium text-muted mb-1">ขนาดแอร์</label>
      <select onchange="updateRowPrice(${id})" id="svcSize-${id}" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white">
        ${AC_SIZES.map(s => `<option value="${s.value}">${s.label}</option>`).join('')}
      </select>
    </div>
    <div class="w-28 shrink-0">
      <label class="block text-[13px] font-medium text-muted mb-1">จำนวนเครื่อง</label>
      <input type="number" min="1" max="20" value="1" onchange="updateRowPrice(${id})" id="svcQty-${id}" class="w-full border border-subtle rounded-lg px-3 py-2 text-[14px] text-ink bg-white" />
    </div>
    <div class="w-28 shrink-0 text-right">
      <label class="block text-[13px] font-medium text-muted mb-1">ราคา</label>
      <p id="svcPrice-${id}" class="text-[14px] font-semibold text-ink py-2">฿0</p>
    </div>
    <button onclick="removeRow(${id})" class="mt-5 sm:mt-0 shrink-0 text-muted hover:text-ink transition-colors p-1.5 rounded-lg hover:bg-hover">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  `;
  container.appendChild(row);
  updateRowPrice(id);
}

function removeRow(id) {
  document.getElementById(`row-${id}`)?.remove();
}

function updateRowPrice(id) {
  const type = document.getElementById(`svcType-${id}`)?.value;
  const size = document.getElementById(`svcSize-${id}`)?.value;
  const qty  = parseInt(document.getElementById(`svcQty-${id}`)?.value) || 1;
  if (!type || !size) return;
  const unitPrice = PRICES[type]?.[size] ?? 0;
  document.getElementById(`svcPrice-${id}`).textContent = `฿${(unitPrice * qty).toLocaleString()}`;
}

function getServiceRows() {
  return Array.from(document.querySelectorAll('[id^="row-"]')).map(row => {
    const id   = row.id.replace('row-', '');
    const type = document.getElementById(`svcType-${id}`)?.value;
    const size = document.getElementById(`svcSize-${id}`)?.value;
    const qty  = parseInt(document.getElementById(`svcQty-${id}`)?.value) || 1;
    if (!type || !size) return null;
    const unitPrice = PRICES[type]?.[size] ?? 0;
    return { typeLabel: type, sizeLabel: size, qty, unitPrice, total: unitPrice * qty };
  }).filter(Boolean);
}

// ── Booking ID ─────────────────────────────────────────────────────────────

function generateBookingId() {
  const d = new Date();
  const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `AC-${date}-${Math.floor(1000 + Math.random() * 9000)}`;
}

function formatDate(s) {
  if (!s) return '-';
  return new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
}

function formatTime(s) {
  if (!s) return '-';
  const [h,m] = s.split(':');
  return `${h}:${m} น.`;
}

// ── Calculate ──────────────────────────────────────────────────────────────

function calculate() {
  const name    = document.getElementById('customerName').value.trim();
  const phone   = document.getElementById('customerPhone').value.trim();
  const address = document.getElementById('customerAddress').value.trim();
  const date    = document.getElementById('serviceDate').value;
  const time    = document.getElementById('serviceTime').value;
  const distEl  = document.getElementById('distance');
  const travelFee    = parseInt(distEl.value);
  const distanceLabel = distEl.options[distEl.selectedIndex].text;
  const note    = document.getElementById('note').value.trim();

  const errorDiv = document.getElementById('errorMsg');
  errorDiv.classList.add('hidden');

  const errors = [];
  if (!name)  errors.push('ชื่อ-นามสกุลลูกค้า');
  if (!phone) errors.push('เบอร์โทรศัพท์');
  if (!date)  errors.push('วันที่บริการ');
  if (!time)  errors.push('เวลาบริการ');
  const rows = getServiceRows();
  if (rows.length === 0) errors.push('รายการบริการอย่างน้อย 1 รายการ');

  if (errors.length) {
    errorDiv.textContent = `กรุณากรอกข้อมูลให้ครบ: ${errors.join(', ')}`;
    errorDiv.classList.remove('hidden');
    return;
  }

  const serviceTotal = rows.reduce((s, r) => s + r.total, 0);
  const grandTotal   = serviceTotal + travelFee;
  const bookingId    = generateBookingId();
  const createdAt    = new Date().toLocaleString('th-TH');

  renderSummary({ bookingId, createdAt, name, phone, address, date, time, distanceLabel, travelFee, rows, serviceTotal, grandTotal, note });
}

function renderSummary({ bookingId, createdAt, name, phone, address, date, time, distanceLabel, travelFee, rows, serviceTotal, grandTotal, note }) {
  document.getElementById('summaryCard').className = 'rounded-xl border border-subtle shadow-sm p-6 bg-white';
  document.getElementById('emptyState').classList.add('hidden');
  const content = document.getElementById('summaryContent');
  content.classList.remove('hidden');
  document.getElementById('printBtn').classList.remove('hidden');

  content.innerHTML = `
    <div class="flex items-center justify-between mb-5">
      <div>
        <p class="text-[12px] text-muted">หมายเลขการจอง</p>
        <p class="text-[18px] font-semibold text-ink tracking-wide">${bookingId}</p>
      </div>
      <span class="bg-ink text-white text-[11px] font-medium px-2.5 py-1 rounded-full">รอยืนยัน</span>
    </div>

    <div class="mb-4">
      <p class="text-[12px] font-medium text-muted uppercase tracking-wide mb-1.5">ข้อมูลลูกค้า</p>
      <p class="text-[14px] font-medium text-ink">${name}</p>
      <p class="text-[13px] text-muted">${phone}</p>
      ${address ? `<p class="text-[13px] text-muted mt-0.5">${address}</p>` : ''}
    </div>

    <div class="mb-4">
      <p class="text-[12px] font-medium text-muted uppercase tracking-wide mb-1.5">วันเวลาบริการ</p>
      <p class="text-[13px] text-ink">${formatDate(date)} เวลา ${formatTime(time)}</p>
    </div>

    <div class="mb-4">
      <p class="text-[12px] font-medium text-muted uppercase tracking-wide mb-1.5">รายการบริการ</p>
      <div class="rounded-lg border border-subtle overflow-hidden">
        ${rows.map(r => `
          <div class="flex justify-between items-start px-3 py-2 border-b border-subtle last:border-0">
            <div>
              <p class="text-[13px] font-medium text-ink">${r.typeLabel} – ${r.sizeLabel}</p>
              <p class="text-[12px] text-muted">${r.qty} เครื่อง × ฿${r.unitPrice.toLocaleString()}</p>
            </div>
            <p class="text-[13px] font-semibold text-ink ml-4 shrink-0">฿${r.total.toLocaleString()}</p>
          </div>`).join('')}
      </div>
    </div>

    <div class="rounded-lg p-3 mb-4 space-y-1.5" style="background:rgb(249,249,247)">
      <div class="flex justify-between text-[13px] text-muted">
        <span>ค่าบริการรวม</span><span>฿${serviceTotal.toLocaleString()}</span>
      </div>
      <div class="flex justify-between text-[13px] text-muted">
        <span>ค่าเดินทาง (${distanceLabel.replace(/\(.*\)/,'').trim()})</span>
        <span>${travelFee > 0 ? `฿${travelFee.toLocaleString()}` : 'ฟรี'}</span>
      </div>
      <div class="border-t border-subtle pt-1.5 flex justify-between text-[15px] font-semibold text-ink">
        <span>รวมทั้งสิ้น</span><span>฿${grandTotal.toLocaleString()}</span>
      </div>
    </div>

    ${note ? `<div class="mb-4"><p class="text-[12px] font-medium text-muted uppercase tracking-wide mb-1">หมายเหตุ</p><p class="text-[13px] text-ink">${note}</p></div>` : ''}
    <p class="text-[11px] text-muted text-right">สร้างเมื่อ ${createdAt}</p>
  `;

  // Print area
  const printArea = document.getElementById('printArea');
  printArea.className = '';
  printArea.innerHTML = `
    <div style="font-family:Inter,sans-serif;max-width:500px;margin:0 auto;padding:32px;color:#1A1A1A;">
      <h1 style="font-size:20px;font-weight:600;margin-bottom:4px;">ใบจองบริการแอร์</h1>
      <p style="font-size:13px;color:#888780;margin-bottom:24px;">สร้างเมื่อ ${createdAt}</p>
      <p style="font-size:13px;margin-bottom:4px;"><strong>หมายเลขจอง:</strong> ${bookingId}</p>
      <p style="font-size:13px;margin-bottom:4px;"><strong>ชื่อลูกค้า:</strong> ${name}</p>
      <p style="font-size:13px;margin-bottom:4px;"><strong>เบอร์โทร:</strong> ${phone}</p>
      ${address ? `<p style="font-size:13px;margin-bottom:4px;"><strong>ที่อยู่:</strong> ${address}</p>` : ''}
      <p style="font-size:13px;margin-bottom:16px;"><strong>วันเวลาบริการ:</strong> ${formatDate(date)} เวลา ${formatTime(time)}</p>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;">
        <thead><tr style="border-bottom:1px solid rgba(0,0,0,0.12);">
          <th style="text-align:left;padding:6px 0;color:#888780;font-weight:500;">บริการ</th>
          <th style="text-align:right;padding:6px 0;color:#888780;font-weight:500;">จำนวน</th>
          <th style="text-align:right;padding:6px 0;color:#888780;font-weight:500;">ราคา</th>
        </tr></thead>
        <tbody>${rows.map(r => `
          <tr style="border-bottom:1px solid rgba(0,0,0,0.08);">
            <td style="padding:6px 0;">${r.typeLabel} – ${r.sizeLabel}</td>
            <td style="padding:6px 0;text-align:right;">${r.qty}</td>
            <td style="padding:6px 0;text-align:right;">฿${r.total.toLocaleString()}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div style="font-size:13px;color:#888780;margin-bottom:4px;">ค่าบริการรวม: ฿${serviceTotal.toLocaleString()}</div>
      <div style="font-size:13px;color:#888780;margin-bottom:8px;">ค่าเดินทาง: ${travelFee > 0 ? `฿${travelFee.toLocaleString()}` : 'ฟรี'}</div>
      <div style="font-size:16px;font-weight:600;border-top:1px solid rgba(0,0,0,0.12);padding-top:8px;">รวมทั้งสิ้น: ฿${grandTotal.toLocaleString()}</div>
      ${note ? `<p style="font-size:13px;margin-top:12px;color:#888780;">หมายเหตุ: ${note}</p>` : ''}
    </div>
  `;

  document.getElementById('summaryCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Reset ──────────────────────────────────────────────────────────────────

function resetForm() {
  ['customerName','customerPhone','customerAddress','note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('serviceTime').value = '09:00';
  document.getElementById('distance').value = '0';
  document.getElementById('serviceList').innerHTML = '';
  document.getElementById('errorMsg').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  document.getElementById('summaryContent').classList.add('hidden');
  document.getElementById('summaryCard').className = 'rounded-xl border border-dashed p-6';
  document.getElementById('summaryCard').style.borderColor = 'rgba(0,0,0,0.15)';
  document.getElementById('printBtn').classList.add('hidden');
  document.getElementById('printArea').innerHTML = '';
  document.getElementById('printArea').className = 'hidden';
  rowCount = 0;
  addServiceRow();
}

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', loadPrices);
</script>
</body>
</html>
